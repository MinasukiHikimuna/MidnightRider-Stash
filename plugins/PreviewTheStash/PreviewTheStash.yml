name: PreviewTheStash
description: Set animated tag preview images by cropping scene video clips with a visual overlay tool.
version: 0.1.0
url: https://github.com/MinasukiHikimuna/MidnightRider-Stash/
ui:
  javascript:
    - PreviewTheStash.js
  css:
    - PreviewTheStash.css
exec:
  - python
  - "{pluginDir}/PreviewTheStash.py"
interface: raw
tasks:
  - name: Set Tag Preview
    description: Extract a square clip from a scene video and set it as a tag preview image
    defaultArgs:
      mode: set_tag_preview
settings:
  defaultDuration:
    displayName: Default Duration
    description: Clip duration in seconds. Optional, defaults to 5.4s if not specified.
    type: STRING
  defaultMaxBitrate:
    displayName: Default Max Bitrate
    description: Encoding bitrate (e.g. 2140k). Optional, defaults to 2140k if not specified. Automatically scaled based on crop area.
    type: STRING
  defaultMaxWidth:
    displayName: Default Max Width
    description: Maximum width in pixels for uploaded previews (e.g. 720). Optional, defaults to 720px if not specified. Larger clips are downscaled before upload.
    type: STRING
  tagOutputDir:
    displayName: Tag Output Directory
    description: Directory to save permanent WebM clips and JSON metadata files. Optional - leave empty to use temp files only (files uploaded to Stash but not saved to disk).
    type: STRING
